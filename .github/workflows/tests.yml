name: FinanceFlow CI

on:
  push:
    branches:
      - main
      - feat/tests-workflow
  pull_request:
    branches:
      - main
      - feat/tests-workflow

jobs:
  backend-tests:
    name: Backend Tests (Java 21 & Gradle)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: financeflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      - name: Run backend tests
        run: ./gradlew test
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/financeflow
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres


  frontend-tests:
    name: Frontend Build & Lint (Node 18)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run linter
        run: npm run lint
        working-directory: frontend

      - name: Run frontend tests
        run: npm run test
        working-directory: frontend

      - name: Run build validation
        run: npm run build
        working-directory: frontend

  deploy-backend:
    name: Deploy Backend (Docker)
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    # Executa apenas se o push for na main (deploy contínuo)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger Deploy
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "🚀 Disparando deploy no Render via Webhook..."
            curl -f "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          elif [ -n "${{ secrets.RAILWAY_TOKEN }}" ]; then
            echo "🚀 Disparando deploy no Railway via CLI..."
            npm i -g @railway/cli
            railway up --detach
          else
            echo "⚠️ Nenhuma credencial de deploy configurada (RENDER_DEPLOY_HOOK_URL ou RAILWAY_TOKEN). O build passou, mas o deploy automático foi pulado."
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-frontend:
    name: Deploy Frontend (Vercel)
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Vercel
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "🚀 Instalando Vercel CLI..."
            npm install --global vercel
            
            echo "🚢 Disparando deploy e build na nuvem da Vercel..."
            vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
          else
            echo "⚠️ VERCEL_TOKEN não configurado. Pulando deploy do frontend."
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}




