server:
  port: ${PORT:8080}

spring:
  application:
    name: financeflow
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/financeflow}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none # schema só por migrations (ADR-0003)
  flyway:
    enabled: true
    validate-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health
