server:
  port: ${PORT:8080}

spring:
  application:
    name: financeflow
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/financeflow}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none # schema só por migrations (ADR-0003)
  flyway:
    enabled: true
    validate-on-migrate: true

app:
  auth:
    jwt-secret: ${APP_JWT_SECRET:dev-secret-local-nao-usar-em-producao} # mínimo 32 bytes; defina em produção
    privacy-version: ${APP_PRIVACY_VERSION:2026-10}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    password-reset-ttl: 1h
    frontend-url: ${APP_FRONTEND_URL:http://localhost:5173} # base do link de redefinição de senha
  email:
    provider: ${APP_EMAIL_PROVIDER:log} # "log" só registra a mensagem no log (desenvolvimento)
  rate-limit:
    trusted-proxies: ${APP_TRUSTED_PROXIES:} # IPs separados por vírgula

springdoc:
  api-docs:
    enabled: ${APP_API_DOCS_ENABLED:true} # desligue em produção (ADR-0038)
  swagger-ui:
    enabled: ${APP_API_DOCS_ENABLED:true}
  writer-with-order-by-keys: true # saída estável para o docs/api.md
  override-with-generic-response: false # os erros vêm de @DocumentedError, por endpoint

management:
  endpoints:
    web:
      exposure:
        include: health
